name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy website
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/DuanVScode-git

            git fetch origin
            git reset --hard origin/main

            docker build -t duanvscode-github:latest .

            docker rm -f mini-game-hub || true

            docker run -d \
              --name mini-game-hub \
              --restart unless-stopped \
              -p 8080:80 \
              duanvscode-github:latest

            docker image prune -f